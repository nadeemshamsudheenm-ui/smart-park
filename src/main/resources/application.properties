# ===================================================================
# SMART PARK — Configuration
# ===================================================================
spring.application.name=smart-park
server.port=8080

# MySQL Database DataSource configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartpark_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Timezone & Locale (Indian Standard Time - IST)
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.locale=en_IN

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SQL Script Initialization (Runs seed data if tables are initialized)
spring.sql.init.mode=always

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload / Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Billing Configuration
smartpark.billing.minimum-charge-hours=1
smartpark.billing.grace-period-minutes=15

# Logging
logging.level.com.smartpark=INFO
logging.level.org.springframework.security=WARN
