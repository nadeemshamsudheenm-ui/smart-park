<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Analytics & Reports')}"></head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav th:replace="~{fragments/sidebar :: sidebar('admin-reports')}"></nav>

        <div class="main-wrapper">
            <!-- Navbar -->
            <header th:replace="~{fragments/navbar :: navbar}"></header>

            <main class="content-body">
                <div class="mb-4">
                    <h2 class="fw-bold mb-1">Analytics & Occupancy Reports</h2>
                    <p class="text-muted mb-0">Detailed capacity metrics, historical revenue analysis, and utilization benchmarks.</p>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-lg-6">
                        <div class="sp-card h-100">
                            <h5 class="fw-bold mb-3"><i class="bi bi-bar-chart-fill text-primary me-2"></i>Area Capacity & Utilization</h5>
                            <div style="height: 320px; position: relative;">
                                <canvas id="adminOccupancyChart"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="sp-card h-100">
                            <h5 class="fw-bold mb-3"><i class="bi bi-graph-up text-success me-2"></i>Weekly Revenue Inflow</h5>
                            <div style="height: 320px; position: relative;">
                                <canvas id="adminRevenueChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div th:replace="~{fragments/scripts :: scripts}"></div>
    <script th:src="@{/js/admin.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadOccupancyChart();
            loadRevenueChart();
        });
    </script>
</body>
</html>
