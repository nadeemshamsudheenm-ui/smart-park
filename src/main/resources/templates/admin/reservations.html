<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('All Reservations')}"></head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav th:replace="~{fragments/sidebar :: sidebar('admin-reservations')}"></nav>

        <div class="main-wrapper">
            <!-- Navbar -->
            <header th:replace="~{fragments/navbar :: navbar}"></header>

            <main class="content-body">
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <div>
                        <h2 class="fw-bold mb-1">Master Reservations Registry</h2>
                        <p class="text-muted mb-0">Complete administrative record of all customer bookings and session states.</p>
                    </div>
                    <div>
                        <button class="btn btn-outline-primary" onclick="initAdminReservationsView()">
                            <i class="bi bi-arrow-clockwise me-1"></i> Refresh
                        </button>
                    </div>
                </div>

                <div class="sp-card">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Booking Ref</th>
                                    <th>Customer</th>
                                    <th>Vehicle</th>
                                    <th>Location & Slot</th>
                                    <th>Start Window</th>
                                    <th>End Window</th>
                                    <th>Status</th>
                                    <th>Fee</th>
                                </tr>
                            </thead>
                            <tbody id="adminReservationsTableBody">
                                <tr>
                                    <td colspan="8" class="text-center py-4 text-muted">Loading reservations...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div th:replace="~{fragments/scripts :: scripts}"></div>
    <script th:src="@{/js/customer.js}"></script>
    <script th:src="@{/js/admin.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initAdminReservationsView();
        });
    </script>
</body>
</html>
