<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin Dashboard')}"></head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav th:replace="~{fragments/sidebar :: sidebar('admin-dashboard')}"></nav>

        <div class="main-wrapper">
            <!-- Navbar -->
            <header th:replace="~{fragments/navbar :: navbar}"></header>

            <main class="content-body">
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <div>
                        <h2 class="fw-bold mb-1">Administrative Intelligence</h2>
                        <p class="text-muted mb-0">Real-time occupancy monitoring, system capacity, and automated revenue metrics.</p>
                    </div>
                    <div>
                        <button class="btn btn-outline-primary" onclick="initAdminDashboard()">
                            <i class="bi bi-arrow-clockwise me-1"></i> Refresh Metrics
                        </button>
                    </div>
                </div>

                <!-- 8 Metric Cards Grid -->
                <div class="row g-3 mb-4">
                    <div class="col-sm-6 col-xl-3">
                        <div class="sp-card stat-card">
                            <div>
                                <div class="text-muted small fw-semibold">PARKING AREAS</div>
                                <div class="fs-2 fw-bold text-dark mt-1" id="adminStatAreas">—</div>
                            </div>
                            <div class="stat-icon stat-blue"><i class="bi bi-geo-alt-fill"></i></div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-xl-3">
                        <div class="sp-card stat-card">
                            <div>
                                <div class="text-muted small fw-semibold">TOTAL SLOTS</div>
                                <div class="fs-2 fw-bold text-dark mt-1" id="adminStatSlots">—</div>
                            </div>
                            <div class="stat-icon stat-purple"><i class="bi bi-grid-3x3-gap-fill"></i></div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-xl-3">
                        <div class="sp-card stat-card">
                            <div>
                                <div class="text-muted small fw-semibold">AVAILABLE SLOTS</div>
                                <div class="fs-2 fw-bold text-success mt-1" id="adminStatAvailable">—</div>
                            </div>
                            <div class="stat-icon stat-green"><i class="bi bi-check-circle-fill"></i></div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-xl-3">
                        <div class="sp-card stat-card">
                            <div>
                                <div class="text-muted small fw-semibold">OCCUPIED SLOTS</div>
                                <div class="fs-2 fw-bold text-danger mt-1" id="adminStatOccupied">—</div>
                            </div>
                            <div class="stat-icon stat-red"><i class="bi bi-dash-circle-fill"></i></div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-xl-3">
                        <div class="sp-card stat-card">
                            <div>
                                <div class="text-muted small fw-semibold">RESERVED SLOTS</div>
                                <div class="fs-2 fw-bold text-warning mt-1" id="adminStatReserved">—</div>
                            </div>
                            <div class="stat-icon stat-orange"><i class="bi bi-clock-fill"></i></div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-xl-3">
                        <div class="sp-card stat-card">
                            <div>
                                <div class="text-muted small fw-semibold">ACTIVE SESSIONS</div>
                                <div class="fs-2 fw-bold text-primary mt-1" id="adminStatSessions">—</div>
                            </div>
                            <div class="stat-icon stat-blue"><i class="bi bi-car-front-fill"></i></div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-xl-3">
                        <div class="sp-card stat-card">
                            <div>
                                <div class="text-muted small fw-semibold">COMPLETED BOOKINGS</div>
                                <div class="fs-2 fw-bold text-secondary mt-1" id="adminStatBookings">—</div>
                            </div>
                            <div class="stat-icon stat-purple"><i class="bi bi-journal-check"></i></div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-xl-3">
                        <div class="sp-card stat-card">
                            <div>
                                <div class="text-muted small fw-semibold">TOTAL REVENUE</div>
                                <div class="fs-2 fw-bold text-success mt-1" id="adminStatRevenue">—</div>
                            </div>
                            <div class="stat-icon stat-green"><i class="bi bi-cash-coin"></i></div>
                        </div>
                    </div>
                </div>

                <!-- Charts Row (Chart.js) -->
                <div class="row g-4 mb-4">
                    <div class="col-lg-6">
                        <div class="sp-card h-100">
                            <h5 class="fw-bold mb-3"><i class="bi bi-bar-chart-fill text-primary me-2"></i>Occupancy by Parking Area</h5>
                            <div style="height: 300px; position: relative;">
                                <canvas id="adminOccupancyChart"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="sp-card h-100">
                            <h5 class="fw-bold mb-3"><i class="bi bi-graph-up text-success me-2"></i>Recent Daily Revenue Trend</h5>
                            <div style="height: 300px; position: relative;">
                                <canvas id="adminRevenueChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div th:replace="~{fragments/scripts :: scripts}"></div>
    <script th:src="@{/js/admin.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initAdminDashboard();
        });
    </script>
</body>
</html>
