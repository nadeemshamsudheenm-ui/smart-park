<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="navbar" class="top-navbar">
    <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-outline-secondary d-md-none" id="sidebarToggleBtn">
            <i class="bi bi-list fs-5"></i>
        </button>
        <span class="fs-5 fw-bold text-secondary d-none d-sm-inline">
            <i class="bi bi-p-square-fill text-primary me-1"></i> Digital Slot Management
        </span>
    </div>
    
    <div class="d-flex align-items-center gap-3">
        <!-- Live Indian Standard Time (IST) Clock -->
        <div class="d-none d-md-flex align-items-center gap-2 bg-light px-3 py-1 rounded-3 border">
            <i class="bi bi-clock-history text-primary"></i>
            <div class="text-start">
                <div class="d-flex align-items-center gap-1">
                    <span class="badge bg-warning text-dark fw-bold px-1 py-0" style="font-size: 0.62rem;">IST</span>
                    <span class="fw-bold font-monospace text-dark lh-1" id="istClockTime" style="font-size: 0.88rem;">--:--:-- --</span>
                </div>
                <small class="text-muted d-block" id="istClockDate" style="font-size: 0.65rem;">Indian Standard Time (UTC+05:30)</small>
            </div>
        </div>

        <div class="text-end d-none d-sm-block" sec:authorize="isAuthenticated()">
            <div class="fw-bold small text-dark" sec:authentication="name">User Email</div>
            <span class="badge bg-primary text-uppercase" style="font-size: 0.65rem;" sec:authentication="principal.authorities">Role</span>
        </div>
        
        <form th:action="@{/logout}" method="post" class="m-0" sec:authorize="isAuthenticated()">
            <button type="submit" class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1" title="Sign Out">
                <i class="bi bi-box-arrow-right"></i> <span class="d-none d-md-inline">Logout</span>
            </button>
        </form>

        <div sec:authorize="isAnonymous()">
            <a th:href="@{/login}" class="btn btn-sm btn-outline-primary me-2">Login</a>
            <a th:href="@{/register}" class="btn btn-sm btn-primary">Sign Up</a>
        </div>
    </div>
</header>
</body>
</html>
