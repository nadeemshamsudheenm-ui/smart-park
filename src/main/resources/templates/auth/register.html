<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Register')}"></head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light py-5">

    <div class="container" style="max-width: 500px;">
        <div class="text-center mb-4">
            <a th:href="@{/}" class="text-decoration-none text-dark d-inline-flex align-items-center gap-2 mb-2">
                <i class="bi bi-p-square-fill text-primary display-5"></i>
                <span class="fs-2 fw-bold">SMART PARK</span>
            </a>
            <p class="text-muted">Create a customer account to reserve parking slots</p>
        </div>

        <div class="sp-card shadow-sm p-4 p-sm-5">
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="mb-3">
                    <label for="fullName" class="form-label fw-semibold">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" class="form-control" id="fullName" placeholder="Jane Doe" required minlength="2">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="jane@example.com" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label fw-semibold">Phone Number</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-telephone text-muted"></i></span>
                        <input type="tel" class="form-control" id="phone" placeholder="+1-555-0199">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="At least 6 characters" required minlength="6">
                    </div>
                </div>

                <button type="submit" id="btnRegister" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-person-check-fill me-1"></i> Create Customer Account
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="text-muted small mb-0">Already registered? <a th:href="@{/login}" class="fw-semibold text-primary">Log in here</a></p>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/scripts :: scripts}"></div>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('btnRegister');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Registering...`;

            const payload = {
                fullName: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const res = await apiFetch('/api/auth/register', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                showToast(res.message, 'success');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } catch (err) {
                showToast(err.message, 'danger');
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-person-check-fill me-1"></i> Create Customer Account`;
            }
        }
    </script>
</body>
</html>
