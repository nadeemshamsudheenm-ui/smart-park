<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('My Vehicles')}"></head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav th:replace="~{fragments/sidebar :: sidebar('vehicles')}"></nav>

        <div class="main-wrapper">
            <!-- Navbar -->
            <header th:replace="~{fragments/navbar :: navbar}"></header>

            <main class="content-body">
                <div class="mb-4">
                    <h2 class="fw-bold mb-1">My Registered Vehicles</h2>
                    <p class="text-muted mb-0">Register vehicle license plates to book suitable parking slots.</p>
                </div>

                <div class="row g-4">
                    <!-- Left: Registration Form -->
                    <div class="col-lg-4">
                        <div class="sp-card">
                            <h5 class="fw-bold mb-3"><i class="bi bi-plus-circle-fill text-primary me-2"></i>Register New Vehicle</h5>
                            <form id="addVehicleForm" onsubmit="addVehicle(event)">
                                <div class="mb-3">
                                    <label for="vehRegistration" class="form-label fw-semibold small">License Plate Number</label>
                                    <input type="text" class="form-control text-uppercase" id="vehRegistration" placeholder="e.g. CA-999-XYZ" required>
                                </div>
                                <div class="mb-4">
                                    <label for="vehType" class="form-label fw-semibold small">Vehicle Category</label>
                                    <select class="form-select" id="vehType" required>
                                        <option value="CAR">Car (Standard Sedan/SUV)</option>
                                        <option value="EV">EV (Electric Vehicle / Charging)</option>
                                        <option value="MOTORCYCLE">Motorcycle / Scooter</option>
                                        <option value="TRUCK">Heavy Truck / Van</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                    <i class="bi bi-save me-1"></i> Register Vehicle
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Right: Vehicles Table -->
                    <div class="col-lg-8">
                        <div class="sp-card">
                            <h5 class="fw-bold mb-3"><i class="bi bi-car-front-fill text-secondary me-2"></i>Active Vehicles</h5>
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>License Plate</th>
                                            <th>Type</th>
                                            <th>Registration Date</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="vehiclesTableBody">
                                        <tr>
                                            <td colspan="4" class="text-center py-4 text-muted">Loading vehicles...</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div th:replace="~{fragments/scripts :: scripts}"></div>
    <script th:src="@{/js/customer.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initVehiclesView();
        });
    </script>
</body>
</html>
