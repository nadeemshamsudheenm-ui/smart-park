<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Active Parking Sessions')}"></head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav th:replace="~{fragments/sidebar :: sidebar('staff-sessions')}"></nav>

        <div class="main-wrapper">
            <!-- Navbar -->
            <header th:replace="~{fragments/navbar :: navbar}"></header>

            <main class="content-body">
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <div>
                        <h2 class="fw-bold mb-1">Active Parking Sessions</h2>
                        <p class="text-muted mb-0">Live monitoring of all currently parked vehicles across your assigned areas.</p>
                    </div>
                    <div>
                        <button class="btn btn-outline-primary" onclick="loadActiveSessions()">
                            <i class="bi bi-arrow-clockwise me-1"></i> Refresh List
                        </button>
                    </div>
                </div>

                <div class="sp-card">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Booking Ref</th>
                                    <th>Vehicle Plate & Type</th>
                                    <th>Assigned Area & Slot</th>
                                    <th>Driver Name</th>
                                    <th>Entry Timestamp</th>
                                    <th>Current Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="activeSessionsTableBody">
                                <tr>
                                    <td colspan="7" class="text-center py-4 text-muted">Loading active sessions...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div th:replace="~{fragments/scripts :: scripts}"></div>
    <script th:src="@{/js/customer.js}"></script>
    <script th:src="@{/js/staff.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadActiveSessions();
        });
    </script>
</body>
</html>
